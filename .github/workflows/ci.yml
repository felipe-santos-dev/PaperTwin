name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma série de commits seguidos cancela as execuções anteriores do mesmo ramo:
# o que importa é o estado final, não o histórico de builds intermediários.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # O esbuild precisa do postinstall para baixar o binário da plataforma, e o
  # npm 12 bloqueia scripts por padrão. O allowScripts no package.json cobre isso.
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # O build da web é o artefato que o e2e exercita; guardar ajuda a
      # investigar uma falha de chunk sem ter de reproduzir a máquina.
      - name: Guardar o build da web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O Playwright sobe a API e serve o build, mas o `preview` não constrói.
      - name: Build
        run: npm run build

      - name: Testes de ponta a ponta
        run: npm run test:e2e --workspace @mp1/web

      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
