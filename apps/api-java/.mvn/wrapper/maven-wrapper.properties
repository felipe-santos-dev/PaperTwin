# O wrapper baixa o Maven na primeira execução, então quem clona o repositório
# não precisa ter Maven instalado — só um JDK. A versão fica aqui para a build
# ser a mesma na máquina de quem desenvolve e no CI.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
