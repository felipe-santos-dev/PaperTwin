<title>MP1 Parte Seca 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cena 3D em tela cheia; painel de seções flutuante (rodapé no celular) */
:root{--bg:#121417;--panel:rgba(18,21,26,.84);--line:rgba(190,200,215,.16);--fg:#e9edf2;--mut:#9aa4b2;--acc:#5fa6d0;--warm:#e2b419;
 --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));width:250px;background:var(--panel);
 border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:10px}
.ui h1{font-size:15px;font-weight:600;margin:0;text-wrap:balance}
.ui p{margin:0;font-size:12px;color:var(--mut);line-height:1.45}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.secs{display:flex;flex-direction:column;gap:3px}
button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 9px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
button:hover{background:rgba(255,255,255,.06)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.on{background:rgba(95,166,208,.16);border-color:rgba(95,166,208,.45)}
button small{color:var(--mut);font-family:var(--mono);font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1;justify-content:center;border-color:var(--line)}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
[hidden]{display:none!important}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;pointer-events:none}
@media (max-width:640px){.ui{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;padding:10px}
 .ui p,.hint{display:none}.secs{flex-direction:row;overflow-x:auto;gap:4px}.secs button{white-space:nowrap}.secs button small{display:none}}
</style>

 <div><h1>MP1 · parte seca</h1><p>Pré-secagem → scanner → Speed Sizer → pós-secagem → calandra → scanner → Pope. Geometria aproximada.</p></div>
 <div class="lbl">Ir para</div>

</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const stage=document.getElementById('stage');let W=stage.clientWidth,H=stage.clientHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});stage.appendChild(renderer.domElement);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191d);scene.fog=new THREE.Fog(0x24272d,35,120);
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=.45;

// ---------- texturas ----------
let seed=11;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
function tex(w,h,draw,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
const grime=(base)=>tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
 for(let i=0;i<900;i++){g.fillStyle=`rgba(${R()<.5?60:255},${R()<.5?60:255},${R()<.5?70:255},${R()*.08})`;g.fillRect(R()*w,R()*h,R()*6,R()*6)}
 for(let i=0;i<60;i++){g.fillStyle=`rgba(70,65,55,${R()*.12})`;g.fillRect(R()*w,R()*h*.5,1+R()*3,h*R())}},[2,2]);
const concrete=tex(1024,1024,(g,w,h)=>{g.fillStyle='#7d7a72';g.fillRect(0,0,w,h);
 for(let i=0;i<14000;i++){const v=90+R()*80|0;g.fillStyle=`rgba(${v},${v-3},${v-10},.25)`;g.fillRect(R()*w,R()*h,2,2)}
 for(let i=0;i<40;i++){const x=R()*w,y=R()*h,r=20+R()*120;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(55,52,45,.35)');gr.addColorStop(1,'rgba(55,52,45,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
 g.strokeStyle='rgba(40,38,34,.35)';g.lineWidth=2;for(let i=0;i<=w;i+=256){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}},[14,6]);
const grating=tex(128,128,(g,w,h)=>{g.fillStyle='#3a3d40';g.fillRect(0,0,w,h);g.fillStyle='#b9bcbf';for(let i=0;i<w;i+=8)g.fillRect(i,0,3,h);for(let j=0;j<h;j+=32)g.fillRect(0,j,w,3)},[8,2]);
const ceilTex=tex(256,256,(g,w,h)=>{g.fillStyle='#50545a';g.fillRect(0,0,w,h);for(let i=0;i<w;i+=16){g.fillStyle='#64686e';g.fillRect(i,0,8,h);g.fillStyle='#3e4146';g.fillRect(i+8,0,2,h)}},[40,10]);
// cilindro secador: aço polido com marcas para enxergar a rotação
const dryerTex=tex(512,64,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#c9ced4');gr.addColorStop(.5,'#aab1b9');gr.addColorStop(1,'#c9ced4');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<40;i++){g.fillStyle=`rgba(90,80,60,${R()*.12})`;g.fillRect(R()*w,0,1+R()*4,h)}
 g.fillStyle='rgba(60,55,45,.35)';g.fillRect(0,0,10,h);g.fillRect(w/2,0,6,h)});
// papel: formação (flocos) visível para perceber o movimento
const paperTex=tex(512,256,(g,w,h)=>{g.fillStyle='#ece8dc';g.fillRect(0,0,w,h);
 for(let i=0;i<700;i++){const x=R()*w,y=R()*h,r=4+R()*18;g.fillStyle=`rgba(${R()<.5?200:255},${R()<.5?194:250},${R()<.5?180:240},${.08+R()*.12})`;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
 g.fillStyle='rgba(150,140,120,.10)';g.fillRect(0,0,w,3)});
const ringTex=tex(512,512,(g,w,h)=>{g.fillStyle='#e6e1d3';g.fillRect(0,0,w,h);for(let r=40;r<256;r+=3){g.strokeStyle=`rgba(150,140,120,${.08+R()*.15})`;g.beginPath();g.arc(256,256,r,0,7);g.stroke()}
 g.fillStyle='#8c8f94';g.beginPath();g.arc(256,256,40,0,7);g.fill()});
const hoodWall=tex(1024,256,(g,w,h)=>{g.fillStyle='#dadddf';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=64){g.fillStyle='rgba(0,0,0,.06)';g.fillRect(x,0,2,h)}
 for(let i=0;i<120;i++){g.fillStyle=`rgba(90,85,70,${R()*.08})`;g.fillRect(R()*w,R()*h,2,h*R())}},[1,1]);
const doorTex=tex(256,512,(g,w,h)=>{g.fillStyle='#dfe2e3';g.fillRect(0,0,w,h);g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=6;g.strokeRect(8,8,w-16,h-16);
 for(let r=0;r<2;r++)for(let c=0;c<2;c++){const x=w*.14+c*w*.38,y=h*.07+r*h*.2;g.fillStyle='#3f4852';g.fillRect(x,y,w*.34,h*.17);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+4,y+4,w*.12,h*.05)}
 g.fillStyle='#e2b419';g.fillRect(w*.42,h*.86,w*.16,h*.04);for(let i=0;i<60;i++){g.fillStyle=`rgba(90,85,70,${R()*.1})`;g.fillRect(R()*w,R()*h,2,h*R()*.5)}});

// ---------- materiais ----------
const M=o=>new THREE.MeshStandardMaterial(o);
const paint=M({color:0xd2d5d8,map:grime('#e4e6e8'),roughness:.62,metalness:.25});
const paintDark=M({color:0x9aa0a6,map:grime('#c9ccd0'),roughness:.6,metalness:.3});
const frameDark=M({color:0x34373c,roughness:.6,metalness:.4});
const blue=M({color:0x5fa6d0,roughness:.45,metalness:.3}), blueDark=M({color:0x3d7fae,roughness:.5,metalness:.3});
const steel=M({color:0xb8bec6,roughness:.3,metalness:.9}), rubber=M({color:0x2a2e33,roughness:.55,metalness:.1});
const dryerM=M({map:dryerTex,roughness:.28,metalness:.85});
const yellow=M({color:0xe2b419,roughness:.55}), black=M({color:0x1a1a1a,roughness:.6});
const white=M({color:0xeceeef,map:grime('#f2f2f2'),roughness:.5,metalness:.1});
const grateM=M({map:grating,roughness:.6,metalness:.5});
const paperM=M({map:paperTex,roughness:.85,side:THREE.DoubleSide,color:0xffffff});
const fabricM=M({color:0x3d4a52,roughness:.9,side:THREE.DoubleSide});

const add=(g,m,x,y,z,sh=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;scene.add(o);return o};
const box=(sx,sy,sz,m,x,y,z,sh=true)=>add(new THREE.BoxGeometry(sx,sy,sz),m,x,y,z,sh);
const WID=8, OS=WID/2+.9;
const spinners=[]; // {obj, r, k}

// ---------- prédio ----------
const fl=add(new THREE.PlaneGeometry(260,120),M({map:concrete,roughness:.28,metalness:.05,color:0xa6a39c}),40,0,10,false);fl.rotation.x=-Math.PI/2;
const ceil=add(new THREE.PlaneGeometry(260,120),M({map:ceilTex,roughness:.8}),40,19,10,false);ceil.rotation.x=Math.PI/2;
for(let x=-10;x<110;x+=12)for(const z of [-2,12,24])box(1.6,.12,.5,M({color:0xffffff,emissive:0xfff3e0,emissiveIntensity:4}),x,18.8,z,false);
box(260,19,.4,M({color:0x3a3e45,roughness:.9}),40,9.5,-16,false);
for(let x=0;x<110;x+=1.2){box(.6,.02,.22,yellow,x,.011,OS+6,false);box(.6,.02,.22,black,x+.6,.011,OS+6,false)}

// ---------- rolo giratório genérico ----------
function roll(x,y,r,mat,len=WID,housing=blue,k=1,ped=false){
 const g=new THREE.Group();g.position.set(x,y,0);scene.add(g);
 const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,64),mat);c.rotation.x=Math.PI/2;c.castShadow=c.receiveShadow=true;g.add(c);
 for(const s of [1,-1]){const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.32,r*.32,.5,24),steel);hub.rotation.x=Math.PI/2;hub.position.z=s*(len/2+.25);g.add(hub);
  for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(r*.09,r*.09,.08),black);const a=i/6*Math.PI*2;b.position.set(Math.cos(a)*r*.22,Math.sin(a)*r*.22,s*(len/2+.52));g.add(b)}}
 if(housing)for(const s of [1,-1]){
  const h=add(new THREE.CylinderGeometry(r*.55,r*.55,.36,32),housing,x,y,s*(len/2+.3));h.rotation.x=Math.PI/2;
  if(ped)box(r*.9,y-r*.4,.5,paintDark,x,(y-r*.4)/2,s*(len/2+.3));
  if(mat===dryerM&&s===1)dryerDetail(x,y,r,len)}
 spinners.push({g,r,k});return g}

// mancal de secador: tampa creme/azul, proteção amarela, junta rotativa de latão com mangueira
let dIdx=0;const capCream=M({color:0xe6dcc0,roughness:.5,metalness:.2}),capBlue=M({color:0x8fd0e8,roughness:.4,metalness:.2});
const brass=M({color:0xb88a4a,roughness:.35,metalness:.85}),hoseM=M({color:0x1c1d20,roughness:.7});
function dryerDetail(x,y,r,len){const z=len/2+.5;dIdx++;
 const cap=add(new THREE.CylinderGeometry(r*.5,r*.5,.12,32),dIdx%3?capCream:capBlue,x,y,z);cap.rotation.x=Math.PI/2;
 const gw=r*1.35,gh=r*1.35;for(const [w,h,dx,dy] of [[gw,.07,0,gh/2],[gw,.07,0,-gh/2],[.07,gh,gw/2,0],[.07,gh,-gw/2,0]])box(w,h,.07,yellow,x+dx,y+dy,z+.08,false);
 const rj=add(new THREE.CylinderGeometry(.09,.09,.7,12),brass,x,y,z+.4,false);rj.rotation.x=Math.PI/2;
 add(new THREE.CylinderGeometry(.16,.16,.22,16).rotateX(Math.PI/2),steel,x,y,z+.78,false);
 const hc=new THREE.CatmullRomCurve3([new THREE.Vector3(x,y,z+.85),new THREE.Vector3(x+.25,y-.5,z+.95),new THREE.Vector3(x+.15,y-1.2,z+.7),new THREE.Vector3(x+.35,y-1.7,z+.3)]);
 add(new THREE.TubeGeometry(hc,20,.04,6),hoseM,0,0,0,false);
 if(dIdx%4===0)box(.5,.6,.25,white,x+1.1,y-.2,z+.1,false);}

// ---------- caminho do papel (polilinha que abraça os rolos) ----------
const path=[];
const P2=(x,y)=>path.push(new THREE.Vector2(x,y));
function wrap(cx,cy,r,a0,a1,n=18){for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;P2(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}}
function ribbonFrom(pts,mat,width,uScale=4){const pos=[],uv=[],idx=[];let L=0;
 pts.forEach((p,i)=>{if(i)L+=p.distanceTo(pts[i-1]);pos.push(p.x,p.y,-width/2,p.x,p.y,width/2);uv.push(L/uScale,0,L/uScale,1);
  if(i){const a=(i-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(idx);g.computeVertexNormals();const o=new THREE.Mesh(g,mat);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}

// ---------- seção de prensas (saída, contexto) ----------
for(const x of [6,10])for(const z of [-OS,OS])box(.45,12,.45,paint,x,6,z);
box(5,.5,2*OS,paint,8,12,0);roll(8,4.2,.95,rubber,WID,blue);roll(8,6.1,.95,steel,WID,blue);
P2(4,5.0);P2(8,5.15);

// ---------- pré-secagem (dois níveis) ----------
const TOP=6.1,BOT=3.0,DR=1.05,PITCH=2.2;
const X0=15, N1=13;
const dryers1=[];
for(let i=0;i<N1;i++){const xt=X0+i*PITCH,xb=xt+PITCH/2;dryers1.push(xt);
 roll(xt,TOP,DR,dryerM,WID,blue);roll(xb,BOT,DR,dryerM,WID,blue,-1);
 // rolos de tela (feltro secador) entre cilindros superiores
 roll(xt+PITCH/2,TOP+1.35,.28,steel,WID,blueDark,-1);
 roll(xb+PITCH/2,BOT-1.35,.28,steel,WID,blueDark);
}
// telas secadoras (superior e inferior)
{const up=[];const dn=[];for(let i=0;i<N1;i++){const xt=X0+i*PITCH;for(let a=200;a>=-20;a-=10){const r=(a*Math.PI/180);up.push(new THREE.Vector2(xt+Math.cos(r)*(DR+.07),TOP+Math.sin(r)*(DR+.07)))}
  up.push(new THREE.Vector2(xt+PITCH/2,TOP+1.35+.3));}
 for(let i=0;i<N1;i++){const xb=X0+i*PITCH+PITCH/2;for(let a=160;a<=380;a+=10){const r=(a*Math.PI/180);dn.push(new THREE.Vector2(xb+Math.cos(r)*(DR+.07),BOT+Math.sin(r)*(DR+.07)))}
  dn.push(new THREE.Vector2(xb+PITCH/2,BOT-1.35-.3));}
 const fTop=ribbonFrom(up,fabricM,WID-.3,3), fBot=ribbonFrom(dn,fabricM,WID-.3,3);
 fTop.position.z=0;fBot.position.z=0;}
// papel serpenteando (por fora da tela: papel encosta no cilindro)
for(let i=0;i<N1;i++){const xt=X0+i*PITCH,xb=xt+PITCH/2;wrap(xt,TOP,DR+.02,200,i<N1-1?-20:15);if(i<N1-1)wrap(xb,BOT,DR+.02,160,380);}
// estrutura e capota da pré-secagem
function frames(x0,x1,h){for(let x=x0;x<=x1+.01;x+=PITCH*2)for(const z of [-OS,OS])box(.35,h,.35,frameDark,x,h/2,z);
 for(const z of [-OS,OS])for(const y of [1.3,4.55,h])box(x1-x0,.35,.35,frameDark,(x0+x1)/2,y,z)}
const H1=[X0-1.8,X0+N1*PITCH+.6];frames(H1[0],H1[1],8.6);
const doors=[];
function hood(x0,x1){const L=x1-x0,c=(x0+x1)/2,z=OS+1.1;
 box(L,.4,2*z,M({map:hoodWall,roughness:.6}),c,10.3,0);                       // teto
 box(L,10.5,.3,M({map:hoodWall,roughness:.6}),c,5.25,-z);                    // parede de trás
 box(L,1.8,.3,M({map:hoodWall,roughness:.6}),c,9.4,z);                       // viga acima das portas
 for(const xe of [x0,x1])box(.3,10.5,2*z,M({map:hoodWall,roughness:.6}),xe,5.25,0);
 const dw=L/Math.round(L/3.6);
 for(let x=x0+dw/2;x<x1;x+=dw){const piv=new THREE.Group();piv.position.set(x,8.5,z+.05);scene.add(piv);
  const d=new THREE.Mesh(new THREE.BoxGeometry(dw-.08,8.1,.12),M({map:doorTex,roughness:.55,metalness:.1}));d.position.y=-4.05;d.castShadow=true;piv.add(d);
  doors.push({piv,x})}}
hood(H1[0],H1[1]);
// luz quente dentro da capota
for(let x=X0+4;x<H1[1];x+=12){const p=new THREE.PointLight(0xffd7a0,25,12,1.8);p.position.set(x,4.5,1);scene.add(p)}

// ---------- scanner QCS (O-frame) genérico ----------
const scanners=[];
const sF=M({color:0x24324f,roughness:.5,metalness:.4}), headM=M({color:0xe9ecef,roughness:.35,metalness:.3});
const laserM=M({color:0xff3a3a,emissive:0xff2020,emissiveIntensity:6});
function scanner(x,y,ph=0){
 for(const yy of [y+.9,y-.9])box(.7,.7,WID+3.6,sF,x,yy,0);
 for(const z of [-(WID/2+1.6),WID/2+1.6])box(.9,y+1.6,.9,sF,x,(y+1.6)/2,z);
 box(.9,.12,WID+3.4,yellow,x+.38,y+1.27,0);
 const hT=box(1.1,.6,1.1,headM,x,y+.45,0),hB=box(1.1,.6,1.1,headM,x,y-.45,0);
 const bm=box(.05,.62,.05,laserM,x,y,0,false);
 box(.04,.012,WID,M({color:0xff4040,emissive:0xff2020,emissiveIntensity:1.2,transparent:true,opacity:.35}),x,y+.012,0,false);
 const cab=box(1.2,2,.6,white,x+1.5,1,WID/2+2.2);
 scanners.push({parts:[hT,hB,bm],ph})}

// ---------- scanner 1 (antes do Speed Sizer) ----------
const G1X=H1[1]+1.6, SC1Y=4.8, SC1X=H1[1]+4;
roll(G1X,SC1Y-.32,.3,steel,WID,blueDark);
wrap(G1X,SC1Y-.32,.32,160,90,6);
scanner(SC1X,SC1Y,0);

// ---------- Speed Sizer (filme de amido, nip vertical) ----------
const SX=SC1X+5;
