name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma série de commits seguidos cancela as execuções anteriores do mesmo ramo:
# o que importa é o estado final, não o histórico de builds intermediários.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # O esbuild precisa do postinstall para baixar o binário da plataforma, e o
  # npm 12 bloqueia scripts por padrão. O allowScripts no package.json cobre isso.
  NODE_VERSION: '24'
  # A mesma do Dockerfile. A 21 é LTS e é o que o Render roda.
  JAVA_VERSION: '21'

jobs:
  java:
    name: API Java
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # `verify` e não `test`: é o que também empacota o jar, e um jar que não
      # fecha é um deploy que falha depois do merge.
      - name: Verificar
        run: ./mvnw -B verify
        working-directory: apps/api-java

      # O contrato é versionado porque o front gera os tipos dele. Se ele mudou
      # e não foi regravado, isto falha aqui — e não na tela de quem abriu.
      - name: O openapi.json versionado está em dia
        run: git diff --exit-code apps/api-java/openapi.json

      - name: Guardar os relatórios do surefire
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/api-java/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O build da web gera o instantâneo do modo de demonstração chamando a
      # API Java (`npm run demo:data`), então este job também precisa de um JDK.
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Instalar dependências
        run: npm ci

      - name: Os tipos gerados do contrato estão em dia
        run: npm run check:api-types --workspace @mp1/shared

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # O build da web é o artefato que o e2e exercita; guardar ajuda a
      # investigar uma falha de chunk sem ter de reproduzir a máquina.
      - name: Guardar o build da web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O e2e roda contra a API Java de verdade: o Playwright sobe o
      # `DevServer` com o Postgres embutido antes de servir a web.
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O Playwright sobe a API e serve o build, mas o `preview` não constrói.
      - name: Build
        run: npm run build

      - name: Testes de ponta a ponta
        run: npm run test:e2e --workspace @mp1/web

      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
